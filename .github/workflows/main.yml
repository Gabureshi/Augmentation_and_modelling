name: Eksperimen SML RayNelsonChan
 
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write
    
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE
      - name: Check out repository
        uses: actions/checkout@v5
 
      # Setup Python 3.12.7
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"
 
      # Install required dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # Run notebook
      - name: Run notebook
        run: |
          pip install nbconvert
          jupyter nbconvert --to notebook --execute --inplace notebook.ipynb
      
      # Commit and push all newly created or updated files
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          
          # Only commit if there are actual changes to prevent workflow errors
          if ! git diff --cached --quiet; then
            git commit -m "Automated: Run experiment notebook and update outputs"
            git push
          else
            echo "No changes detected. Skipping commit."
          fi  
