name: Eksperimen SML RayNelsonChan
 
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write
    
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE
      - name: Check out repository
        uses: actions/checkout@v5
 
      # Setup Python 3.12.7
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"
 
      # Install requirement dependencies
      - name: Install Requirement Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # Install Jupyter execution tools and project dependencies
      - name: Install Jupyter Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert ipykernel

      # Execute the notebook and save the populated output
      - name: Execute Notebook
        run: |
          jupyter nbconvert --to notebook --execute --inplace notebook.ipynb
  
      # Save the executed notebook as a downloadable build artifact
      - name: Upload Executed Notebook
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: notebook.ipynb  
        
      # Commit and push all newly created or updated files
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          
          # Only commit if there are actual changes to prevent workflow errors
          if ! git diff --cached --quiet; then
            git commit -m "Automated: Run experiment notebook and update outputs"
            git push
          else
            echo "No changes detected. Skipping commit."
          fi  
